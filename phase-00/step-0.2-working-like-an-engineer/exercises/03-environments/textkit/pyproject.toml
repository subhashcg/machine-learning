[project]
name = "textkit"
version = "0.1.0"
description = "A small word-counting package"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
wordcount = "textkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
